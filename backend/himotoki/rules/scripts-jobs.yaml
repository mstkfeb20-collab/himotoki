name: scripts-jobs
description: >
  Shell / batch scripts started by job schedulers. Finds the Java main classes,
  batch jobs, SQL scripts and other scripts they start, and the data files they
  read or write, so that jobs, programs and files chain together.
text:
  - name: shell
    files: ["**/*.sh", "**/*.ksh", "**/*.bash", "**/*.csh", "**/*.bat", "**/*.cmd"]
    node: {kind: Script, keys: ["file:{path}", "script:{basename}"]}
    expand_vars: true          # OUT_FILE=${OUT_DIR}/X.dat ... send_file $OUT_FILE
    patterns:
      - {regex: '\bjava\b[^\n]*?\s((?:[a-z_][\w]*\.)+[A-Z]\w+)(?:\s|$)', key: "class:{1}", rel: RUNS, conf: 0.9}
      # a wrapper function that starts Java (run_java, exec_batch …): a fully qualified class
      # name on a command line (comments excluded); only names of indexed classes resolve
      - {regex: '(?m)^[ \t]*[^#\n]*?[\s"''=]((?:[a-z_][\w]*\.){2,}[A-Z]\w+)(?=[\s"'';]|$)', key: "class:{1}", rel: RUNS, conf: 0.75}
      - {regex: 'CommandLineJobRunner\s+(\S+)\s+([\w\-]+)', key: "batchjob:{2}", rel: RUNS, conf: 0.95}
      - {regex: '(?:sqlplus|sqlcl)\b[^\n]*@\s*"?([\w./${}\-]+\.sql)', key: "file:{1}", rel: EXECUTES, conf: 0.85}
      - {regex: '\bpsql\b[^\n]*\s-f\s+"?([\w./${}\-]+\.sql)', key: "file:{1}", rel: EXECUTES, conf: 0.85}
      # `. common.sh` / `source common.sh` takes in functions and settings: not a run
      - {regex: '(?m)^[ \t]*(?:\.|source)[ \t]+"?([\w./${}\-]+\.(?:sh|ksh|bash|env|conf))\b', key: "file:{1}", rel: INCLUDES, conf: 0.9}
      - {regex: '(?m)^(?![ \t]*(?:\.|source)[ \t])[^#\n]*?(?:^|[\s;&|(`])(?:sh|bash|ksh)?\s*"?([\w./${}\-]+\.(?:sh|ksh|bash))\b', key: "file:{1}", rel: RUNS, conf: 0.8}
      - {regex: '>>?\s*"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|out))\b', key: "datafile:{1}", rel: WRITES, conf: 0.8}
      - {regex: '(?:<|\bcat\b|\bcp\b|\bmv\b|-i\s|--input[= ]|IN_FILE=|INPUT=)\s*"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix))\b', key: "datafile:{1}", rel: READS, conf: 0.7}
      - {regex: '\b(?:psql|sqlplus)\b[^\n]*?\s-c\s+"([^"]+)"', key: "{1}", sql: true, conf: 0.85}
      - {regex: '<<\s*-?\s*[''"]?(?:EOF|EOS|SQL|END)[''"]?\n([\s\S]*?)\n\s*(?:EOF|EOS|SQL|END)\b', key: "{1}", sql: true, conf: 0.8}
      - {regex: '(?:OUT_FILE=|OUTPUT=|-o\s|--output[= ])\s*"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix))\b', key: "datafile:{1}", rel: WRITES, conf: 0.75}
      # copy / move: the second path is written
      - {regex: '\b(?:cp|mv)\s+(?:-\w+\s+)*\S+\s+"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))\b', key: "datafile:{1}", rel: WRITES, conf: 0.8}
      # file transfer: sftp / ftp batch lines (put local remote, get remote local) and scp
      - {regex: '(?m)^\s*m?put\s+"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))"?(?:\s|$)', key: "datafile:{1}", rel: READS, conf: 0.85}
      - {regex: '(?m)^\s*m?put\s+\S+\s+"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))', key: "datafile:{1}", rel: WRITES, conf: 0.85}
      - {regex: '(?m)^\s*m?get\s+"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))"?(?:\s|$)', key: "datafile:{1}", rel: READS, conf: 0.85}
      - {regex: '(?m)^\s*m?get\s+\S+\s+"?([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))', key: "datafile:{1}", rel: WRITES, conf: 0.85}
      - {regex: '\bscp\b[^\n]*?\s([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))\s+\S+:([\w./${}\-]+)', key: "datafile:{1}", rel: READS, conf: 0.85}
      - {regex: '\bscp\b[^\n]*?\s\S+\s+\S+:([\w./${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip))', key: "datafile:{1}", rel: WRITES, conf: 0.85}
      # site wrapper functions / commands that send or receive a file (send_file, hulft_send,
      # ftp_put, upload, 配信; recv_file, ftp_get, download): the sender reads the local
      # file, the receiver writes it
      - {regex: '(?mi)^[ \t]*[^#\n]*?\b\w*(?:send|put|upload|haisin|haishin|soushin|transfer|hulft)\w*\b[^\n]*?[\s"''=/]([\w.${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip|lst|prn|seq))\b', key: "datafile:{1}", rel: READS, conf: 0.8, props: {transfer: send}}
      - {regex: '(?mi)^[ \t]*[^#\n]*?\b\w*(?:recv|receive|get|download|jushin|syusyu|shushu)\w*\b[^\n]*?[\s"''=/]([\w.${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip|lst|prn|seq))\b', key: "datafile:{1}", rel: WRITES, conf: 0.8, props: {transfer: receive}}
      # variables named for output / input
      - {regex: '(?m)^[ \t]*(?:export\s+)?\w*(?:OUT|SEND|EXP|DST|SND)\w*=\s*"?[^\n]*?([\w.${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip|lst|prn|seq))\b', key: "datafile:{1}", rel: WRITES, conf: 0.7}
      - {regex: '(?m)^[ \t]*(?:export\s+)?\w*(?:IN|RCV|RECV|IMP|SRC)\w*=\s*"?[^\n]*?([\w.${}\-]+\.(?:dat|csv|tsv|txt|fix|gz|zip|lst|prn|seq))\b', key: "datafile:{1}", rel: READS, conf: 0.7}
      # any other data file named on a command line: connected, direction unknown
      - {regex: '(?m)^[ \t]*[^#\n]*?[\s"''=/]([\w.${}\-]+\.(?:dat|csv|tsv|fix|gz|zip|lst|prn|seq))\b', key: "datafile:{1}", rel: REFERENCES, conf: 0.6, fallback: true}
      # SQL*Loader: control file and data file
      - {regex: '\bsqlldr\b[^\n]*\bcontrol=([\w./${}\-]+)', key: "file:{1}", rel: EXECUTES, conf: 0.9}
      - {regex: '\bsqlldr\b[^\n]*\bdata=([\w./${}\-]+)', key: "datafile:{1}", rel: READS, conf: 0.9}
  - name: sqlldr-control
    files: ["**/*.ctl"]
    node: {kind: Script, keys: ["file:{path}"]}
    patterns:
      - {regex: '(?i)\binto\s+table\s+([\w$#."]+)', key: "table:{1}", rel: WRITES, conf: 0.95}
      - {regex: '(?i)\binfile\s+''([^'']+)''', key: "datafile:{1}", rel: READS, conf: 0.9}
