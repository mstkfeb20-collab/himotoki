name: propagation
description: >
  How impact spreads over the graph. `in` follows edges pointing at the changed
  element (its dependents), `out` follows edges leaving it. Effective strength =
  weight x edge confidence. Tune here, not in code.
propagation:
  - {rel: BINDS, dir: in, weight: 0.85}
  - {rel: MAPS_TO, dir: out, weight: 0.9}
  - {rel: MAPS_TO, dir: in, weight: 0.7}
  - {rel: DEFINES, dir: in, weight: 0.9}
  - {rel: POPULATES, dir: in, weight: 0.5, positional_weight: 0.9}
  - {rel: TESTS, dir: in, weight: 0.6}   # tests follow what they test, below the code to change
  - {rel: HANDLES, dir: in, weight: 0.75}
  - {rel: DESCRIBES, dir: in, weight: 0.8}
  - {rel: DOC_CRUD, dir: in, weight: 0.75}
  - {rel: CALLS, dir: in, weight: 0.65}
  - {rel: REFERENCES, dir: in, weight: 0.6}
  - {rel: IMPLEMENTED_BY, dir: in, weight: 0.9}
  - {rel: IMPLEMENTED_BY, dir: out, weight: 0.7}
  - {rel: EXECUTES, dir: in, weight: 0.85}
  # data flow between jobs and servers: whoever reads a changed data file, and the file
  # a changed exporter / transfer writes. `flow` rules continue past the depth limit
  # (up to the run parameter flow_depth, default 8 hops, kept while the score
  # stays above flow_min_score, default 0.1) so a hand-over is followed to its end.
  - {rel: READS, dir: in, weight: 0.95, from_kinds: [DataFile], flow: true}
  - {rel: WRITES, dir: out, weight: 0.95, to_kinds: [DataFile], flow: true}
  - {rel: PRECEDES, dir: out, weight: 0.8, from_kinds: [Job], flow: true, only_in_flow: true}
  - {rel: RUNS, dir: out, weight: 0.85, from_kinds: [Job], flow: true, only_in_flow: true}
  - {rel: READS, dir: in, weight: 0.75}
  - {rel: WRITES, dir: in, weight: 0.8}
  - {rel: WRITES, dir: out, weight: 0.6}
  - {rel: INCLUDES, dir: in, weight: 0.6}
  - {rel: RUNS, dir: in, weight: 0.8}
  - {rel: PRECEDES, dir: out, weight: 0.5}
  - {rel: OBSERVED_AS, dir: in, weight: 0.6}
  - {rel: INJECTS, dir: in, weight: 0.5}
  - {rel: CONFIGURES, dir: in, weight: 0.7}
  - {rel: CONTAINS, dir: in, weight: 0.55, from_kinds: [Field, Column, MessageKey, SqlStatement]}
  - {rel: EXTENDS, dir: in, weight: 0.5}
  - {rel: USES_MESSAGE, dir: in, weight: 0.7, from_kinds: [MessageKey]}
