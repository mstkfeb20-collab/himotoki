[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himotoki"
version = "2.0.0"
description = "Requirement / change-set impact analysis over a cross-language code graph (Java, SQL, jobs, Office design documents)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
himotoki = "himotoki.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["himotoki*"]

[tool.setuptools.package-data]
himotoki = ["rules/*.yaml", "web/*.html", "web/*.json", "web/assets/*", "demo/**/*"]
