# Production-style stack: Neo4j for the code graph + the analyzer API/viewer.
# Mount the repositories (and design documents) you want to analyse under /repos.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-impact-dev-password}
      NEO4J_server_memory_heap_max__size: 2G
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-impact-dev-password} 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 12

  analyzer:
    build: .
    depends_on:
      neo4j: { condition: service_healthy }
    environment:
      IMPACT_STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-impact-dev-password}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IMPACT_LLM_MODEL: ${IMPACT_LLM_MODEL:-claude-sonnet-5-5}
    ports: ["8765:8765"]
    volumes:
      - ${REPOS_DIR:-./repos}:/repos:ro
      - analyzer-data:/data

volumes:
  neo4j-data:
  analyzer-data:
