# Production-style stack: Neo4j for the code graph + the analyzer API/viewer.
# Mount the repositories (and design documents) you want to analyse under /repos.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 2G
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 12

  analyzer:
    build: .
    depends_on:
      neo4j: { condition: service_healthy }
    environment:
      HIMOTOKI_STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HIMOTOKI_LLM_MODEL: ${HIMOTOKI_LLM_MODEL:-claude-sonnet-5-5}
      HIMOTOKI_API_TOKEN: ${HIMOTOKI_API_TOKEN:?set HIMOTOKI_API_TOKEN in .env (long random string)}
      HIMOTOKI_ALLOWED_HOSTS: ${HIMOTOKI_ALLOWED_HOSTS:-localhost,127.0.0.1}
      HIMOTOKI_ALLOWED_ROOTS: /repos:/data         # paths the API may index / import from
      HIMOTOKI_RULES: /rules                       # site-specific rule packs (YAML)
      HIMOTOKI_CODESEARCH: ${HIMOTOKI_CODESEARCH:-}  # e.g. zoekt:http://zoekt:6070 or gitlab:https://gitlab.example/api/v4:<project id>
      HIMOTOKI_WEBHOOK_SECRET: ${HIMOTOKI_WEBHOOK_SECRET:-}
      GITLAB_API: ${GITLAB_API:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports: ["127.0.0.1:8765:8765"]   # publish beyond localhost only behind TLS
    volumes:
      - ${REPOS_DIR:-./repos}:/repos:ro
      - ${RULES_DIR:-./samples/rules}:/rules:ro
      - analyzer-data:/data

volumes:
  neo4j-data:
  analyzer-data:
